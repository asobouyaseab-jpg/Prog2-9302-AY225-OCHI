<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Side-Scroll Brawler</title>
  <style>
    canvas {
      border: 1px solid black;
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>
  <!-- 画面サイズを1280x720に指定 -->
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // キー入力管理
    let keys = {};
    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    // 背景画像（タイル化用）
    let bgImage = new Image();
    bgImage.src = "background.png"; // 後で差し替え可能

    // プレイヤークラス
    class Player {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.speed = 6;
        this.isAttacking = false;
        this.attackTimer = 0;
        this.comboStep = 0; // コンボ段階（0〜2）
      }

      update() {
        let dx = 0, dy = 0;
        // WASDで八方向移動
        if (keys["a"]) dx -= this.speed;   // 左
        if (keys["d"]) dx += this.speed;   // 右
        if (keys["w"]) dy -= this.speed;   // 上
        if (keys["s"]) dy += this.speed;   // 下

        this.x += dx;
        this.y += dy;

        if (this.isAttacking) {
          this.attackTimer--;
          if (this.attackTimer <= 0) {
            this.isAttacking = false;
            this.comboStep = (this.comboStep + 1) % 3; // 次のコンボへ
          }
        }
      }

      attack() {
        if (!this.isAttacking) {
          this.isAttacking = true;
          this.attackTimer = 15; // 各攻撃の持続フレーム
        }
      }

      draw() {
        // 後でスプライトに差し替え可能なように矩形で仮描画
        ctx.fillStyle = "blue";
        ctx.fillRect(this.x, this.y, 60, 60);

        if (this.isAttacking) {
          ctx.fillStyle = "red";
          if (this.comboStep === 0) {
            // 1段目：横に長い突き
            ctx.fillRect(this.x + 60, this.y + 10, 50, 20);
          } else if (this.comboStep === 1) {
            // 2段目：縦に広い斬り
            ctx.fillRect(this.x + 40, this.y - 20, 30, 100);
          } else if (this.comboStep === 2) {
            // 3段目：斜め上に大きく振り上げ
            ctx.fillRect(this.x + 60, this.y - 30, 60, 40);
          }
        }
      }
    }

    let player = new Player(100, 100);

    // 攻撃キーをスペースに変更
    window.addEventListener("keydown", e => {
      if (e.code === "Space") player.attack();
    });

    // 背景描画（タイル化）
    function drawBackground() {
      let pattern = ctx.createPattern(bgImage, "repeat");
      ctx.fillStyle = pattern;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // メインループ
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();

      player.update();
      player.draw();

      requestAnimationFrame(gameLoop);
    }

    bgImage.onload = () => {
      gameLoop();
    };
  </script>
</body>
</html>
