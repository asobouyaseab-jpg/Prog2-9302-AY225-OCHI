<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First WebGL Triangle</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    canvas {
      width: 600px;
      max-width: 95vw;
      height: 400px;
      background: #101827;
      border: 1px solid #cbd5e1;
    }
  </style>
</head>
<body>
  <canvas id="glCanvas" width="600" height="400">
    Your browser does not support canvas.
  </canvas>
 
  <script>
    const canvas = document.querySelector("#glCanvas");
    const gl = canvas.getContext("webgl");
 
    if (!gl) {
      document.body.insertAdjacentHTML(
        "beforeend",
        "<p>WebGL is unavailable or disabled in this browser.</p>"
      );
      throw new Error("Could not start WebGL.");
    }
 
    // The vertex shader positions each triangle corner.
    const vertexSource = `
      attribute vec2 aPosition;
      attribute vec3 aColor;
      varying vec3 vColor;
 
      void main() {
        gl_Position = vec4(aPosition, 0.0, 1.0);
        vColor = aColor;
      }
    `;
 
    // The fragment shader chooses the color of each pixel.
    const fragmentSource = `
      precision mediump float;
      varying vec3 vColor;
 
      void main() {
        gl_FragColor = vec4(vColor, 1.0);
      }
    `;
 
    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
 
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error("Shader compile error: " + message);
      }
      return shader;
    }
 
    const vertexShader = createShader(
      gl.VERTEX_SHADER, vertexSource
    );
    const fragmentShader = createShader(
      gl.FRAGMENT_SHADER, fragmentSource
    );
 
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
 
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error("Program link error: " +
                      gl.getProgramInfoLog(program));
    }
 
    // Each vertex contains: x, y, red, green, blue.
    const vertices = new Float32Array([
       0.0,  0.7,  1.0, 0.2, 0.2,  // top: red
      -0.7, -0.6,  0.2, 1.0, 0.3,  // left: green
       0.7, -0.6,  0.2, 0.4, 1.0   // right: blue
    ]);
 
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
 
    gl.useProgram(program);
 
    const stride = 5 * Float32Array.BYTES_PER_ELEMENT;
 
    const positionLocation =
      gl.getAttribLocation(program, "aPosition");
    gl.vertexAttribPointer(
      positionLocation, 2, gl.FLOAT, false, stride, 0
    );
    gl.enableVertexAttribArray(positionLocation);
 
    const colorLocation =
      gl.getAttribLocation(program, "aColor");
    gl.vertexAttribPointer(
      colorLocation, 3, gl.FLOAT, false, stride,
      2 * Float32Array.BYTES_PER_ELEMENT
    );
    gl.enableVertexAttribArray(colorLocation);
 
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.06, 0.09, 0.15, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
 
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  </script>
</body>
</html>
