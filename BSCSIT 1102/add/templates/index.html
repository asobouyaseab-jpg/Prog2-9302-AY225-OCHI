<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>多機能計算ツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input, button {
            margin: 10px;
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .section {
            margin: 20px 0;
            padding: 10px;
            border-top: 1px solid #eee;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>多機能計算ツール</h1>

        <!-- 温度変換 -->
        <div class="section">
            <h2>温度変換</h2>
            <form method="POST" action="/temperature">
                <label for="temperature">{{ input_label }}</label><br>
                <input type="text" name="temperature" placeholder="温度を入力"><br>
                <button type="submit" name="convert">変換</button>
            </form>
            <form method="POST" action="/">
                <button type="submit" name="toggle">単位切り替え（{{ input_label }} → {{ output_label }}）</button>
            </form>
        </div>

        <!-- 成績フィルタリング -->
        <div class="section">
            <h2>成績フィルタリング（85点以上）</h2>
            <form method="POST" action="/grades">
                <button type="submit">成績を表示</button>
            </form>
        </div>

        <!-- 素数生成 -->
        <div class="section">
            <h2>素数リスト生成</h2>
            <form method="POST" action="/primes">
                <label for="N">2以上の数値を入力:</label><br>
                <input type="text" name="N" placeholder="例: 100"><br>
                <button type="submit">素数を生成</button>
            </form>
        </div>

        <!-- エラーメッセージ -->
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
