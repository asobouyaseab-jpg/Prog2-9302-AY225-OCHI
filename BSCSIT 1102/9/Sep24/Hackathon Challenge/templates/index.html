<!DOCTYPE html>
<html>
<head>
    <title>Project Costing Calculator</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
    <h2>🏗️ Project Costing Calculator</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Initial Project Budget (₱):</label><br>
        <input type="number" step="0.01" name="budget" required><br><br>

        <label>Labor (%)</label><br>
        <input type="number" step="0.01" name="labor" required><br><br>

        <label>Materials (%)</label><br>
        <input type="number" step="0.01" name="materials" required><br><br>

        <label>Equipment (%)</label><br>
        <input type="number" step="0.01" name="equipment" required><br><br>

        <label>Contingency (%)</label><br>
        <input type="number" step="0.01" name="contingency" required><br><br>

        <button type="submit">Calculate</button>
    </form>
</body>
</html>
