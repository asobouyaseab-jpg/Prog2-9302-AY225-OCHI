<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Timer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .timer-container {
            background: linear-gradient(145deg, black, black);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        .timer-title {
            color: #ddd;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .timer-circle {
            width: 200px;
            height: 200px;
            border: 4px solid white;
            border-radius: 50%;
            position: relative;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }
        .timer-display {
            font-size: 36px;
            color: white;
            font-weight: bold;
        }
        .start-pause {
            background-color: #00ff00;
        }
        .timer-buttons {
            display: flex;
            justify-content: space-around;
        }
        .timer-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: background-color 0.3s;
        }
        .reset-btn {
            background-color: #007acc;
            color: white;
        }
        .start-btn {
            background-color: #007acc;
            color: white;
        }
        .start-btn.paused {
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <div class="timer-title">Timer</div>
        <div class="timer-circle">
            <div class="timer-display" id="display">00:00</div>
        </div>
        <div class="timer-buttons">
            <button class="timer-btn reset-btn" onclick="resetTimer()">🔄</button>
            <button class="timer-btn start-btn" id="startBtn" onclick="toggleTimer()">▶</button>
        </div>
    </div>

    <script>
        let timerInterval;
        let seconds = 0;
        let isRunning = false;
        const display = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');

        function updateDisplay() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                updateDisplay();
            }, 1000);
            isRunning = true;
            startBtn.textContent = '⏸';
            startBtn.classList.add('paused');
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = '▶';
            startBtn.classList.remove('paused');
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            isRunning = false;
            updateDisplay();
            startBtn.textContent = '▶';
            startBtn.classList.remove('paused');
        }

        updateDisplay(); // 初期表示
    </script>
</body>
</html>
