<!DOCTYPE html>
<html lang="en">
<head>
<meta charaset="UTF-8">
<meta name=" viewspot" content="width=device-width," initial-scale="1.0">
  <title>Interactive CSS Practice</title>
  <style>
    body {
     font-family: Arial, sans-serif;
     margin: 20px;
     background: #f5f5f5;
    }

    h2 {
      margin-top: 40px; 
      color: #333; 
    }

    button {
        margin: 5px;
        padding: 6px 10px;
        border: none;
        background: #0077cc;
        color: white;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover{
        background: #005999;
    }

    /*Box_Model*/
    .box {
      width: 300px;
      height: 100px;
      padding: 15px;
      border: 5px solid #0077cc;
      margin: 20px;
      background-color: #cce7ff;
      transition: all 0.3s ease;
    }

    .flex-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #e3f7e3;
      border: 3px dashed #2ecc40;
      padding: 20px;
      margin: 30px auto;
      width: 700px;
      height: 120px;
    }

    .flex-item {
      background: #2ecc40;
      color: #fff;
      padding: 20px;
      font-size: 18px;
      border-radius: 8px;
      text-align: center;
      margin: 0 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 15px;
      background-color: #f9f6e7;
      border: 3px dotted #ff851b;
      padding: 20px;
      margin: 30px auto;
      width: 420px;
    }

    .grid-item {
      background: #ff851b;
      color: #fff;
      padding: 20px;
      font-size: 18px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
   <h1>Interactive CSS Practice</h1>

   <!--BOX MODEL-->
   <h2>1. Box Model</h2>
   <button onclick="togglebox()">Toggle <Padding>
   <margin></margin></button>
   <div class="box">>This is margin,border,and padding.</div>

    <!--FLEX MODEL-->
    <h2>2. Flexbox</h2>
    <button onclick="changeFlex('center')">Justify Center</button>
    <button onclick="changeFlex('space-between')">Space-between</button>
    <button onclick="changeFlex('flex-end')">Align Right</button>

    <div class="flex-container" id="flex-container">
    <div class="flex-item">Flex Item 1</div>
    <div class="flex-item">Flex Item 2</div>
    <div class="flex-item">Flex Item 3</div>
    </div>

    <!--GRID-->
    <h2>3. Grid</h2>
    <button onclick="changeGrid(2)">2 columns</button>
    <button onclick="changeGrid(3)">3 columns</button>
    <button onclick="changeGrid(4)">4 columns</button>

    <div class="grid-container" id="grid-container">
    <div class="grid-item">Grid Item 1</div>
    <div class="grid-item">Grid Item 2</div>
    <div class="grid-item">Grid Item 3</div>
    <div class="grid-item">Grid Item 4</div>
    <div class="grid-item">Grid Item 5</div>
    <div class="grid-item">Grid Item 6</div>
    </div>
  
  <script>
    /*box model doggle*/
    function togglebox() {
        const box = document.querySelector('.box');
        if (box.style.padding === '40px') {
            box.style.padding = '15px'
            box.style.margin = '20px'
        } else{
            box.style.padding ='40px'
            box.style.margin = '50px'
        }
    }
    /*flexbox controls*/
    function changeFlex(value) {
      document.getElementById('flex-container').style.justifyContent = value;
    }

    /*grid controls*/
    function changeGrid(value) {
      document.getElementById('grid-container').style.gridTemplateColumns = `repeat(${value}, 1fr)`;
    }
  </script>
</body>
</html>
