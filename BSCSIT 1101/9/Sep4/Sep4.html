<!DOCTYPE html>
<html>
<head>
  <title>CSS Box Model, Flexbox & Grid Example</title>
  <style>
    .box-model-example {
      width: 300px;
      height: 120px;
      padding: 20px;
      border: 5px solid #0074D9;
      margin: 30px auto;
      background-color: #f0f8ff;
      color: #333;
      font-family: Arial, sans-serif;
      box-sizing: content-box;
    }
    .label {
      font-weight: bold;
      color: #0074D9;
    }
    /* Flexbox Example */
    .flex-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #e3f7e3;
      border: 3px dashed #2ecc40;
      padding: 20px;
      margin: 30px auto;
      width: 400px;
      height: 120px;
    }
    .flex-item {
      background: #2ecc40;
      color: #fff;
      padding: 20px;
      font-size: 18px;
      border-radius: 8px;
      text-align: center;
      flex: 1 1 0;
      margin: 0 10px;
    }
    /* Grid Example */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 15px;
      background-color: #f9f6e7;
      border: 3px dotted #ff851b;
      padding: 20px;
      margin: 30px auto;
      width: 420px;
    }
    .grid-item {
      background: #ff851b;
      color: #fff;
      padding: 20px;
      font-size: 18px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="box-model-example">
    <span class="label">CSS Box Model</span><br>
    Content area<br>
    Padding: 20px<br>
    Border: 5px solid<br>
    Margin: 30px
  </div>

  <div class="flex-container">
    <div class="flex-item">Flex Item 1</div>
    <div class="flex-item">Flex Item 2</div>
    <div class="flex-item">Flex Item 3</div>
  </div>

  <div class="grid-container">
    <div class="grid-item">Grid Item 1</div>
    <div class="grid-item">Grid Item 2</div>
    <div class="grid-item">Grid Item 3</div>
    <div class="grid-item">Grid Item 4</div>
    <div class="grid-item">Grid Item 5</div>
    <div class="grid-item">Grid Item 6</div>
  </div>
</body>
</html>
