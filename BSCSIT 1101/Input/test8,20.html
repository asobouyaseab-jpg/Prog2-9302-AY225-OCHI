<html>
<head>
    <title>CSS Animaation</title>
    <style>
             .box{
                background-color: rebeccapurple;
                border-radius: 10px;
                width: 250px;
                height: 250px;
                text-align: center;

                margin: 12% 0 0 40%;
                padding: 10px;
                color: white;
             }
             .box:hover {
                animation-name: rotate;
                animation-duration: 0.7s;
                animation-delay: 2s;
             }
             @keyframes rotate{
                0% {
                transform: rotate(0);
             }
             100%{ 
                transform: rotate(-360deg);
            }
        }
    </style>
</head>
<body> == $0
    <div class="box">Nobutoshi</div>
</body>
</html>
